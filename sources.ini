# Hushlist sources: lists the site downloads, converts to hosts format and publishes.
#
# To add a list: copy a block below, change the name in [brackets] and the url,
# then commit. The site updates within a few minutes, and re-checks every 15 minutes.
#
#   [name]        becomes the file name: lists/<name>.txt  (letters, numbers, dashes)
#                 Don't rename it later: people's subscriptions use that address.
#   url           the link to the list (adblock ||domain^ , hosts, or plain domains)
#   title         shown on the website (optional)
#   description   shown on the website (optional)
#   credit        who made the list (keep this for lists you didn't make)
#   license       the list's licence (check it allows redistribution)
#
# To remove a list, delete its block.
#
# The main Hushlist list isn't fetched from here: it is the file lists/hushlist.txt in this repo.
