name: Test installers

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check macOS installer shell syntax
        run: bash -n install/hushlist-mac.command

  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install/hushlist-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
