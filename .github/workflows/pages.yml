name: Publish site

on:
  push:
    branches: [main]          # editing sources.ini or a list publishes within ~1 minute
  schedule:
    - cron: "17 * * * *"      # hourly: re-check lists added by link in sources.ini
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history so "Updated" dates are accurate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Check the installers (signatures, syntax, self-tests)
        run: python scripts/release.py verify

      - name: Sync upstream lists (sources.ini)
        run: python scripts/sync_upstream.py

      - name: Build lists.json
        run: python scripts/build_manifest.py

      - name: Assemble site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          mkdir _site
          cp index.html lists.json manifest.webmanifest icon-*.png _site/
          cp -r lists install _site/
          touch _site/.nojekyll
          # Fingerprint of the content (ignoring timestamps) to detect real changes
          (cd _site && find lists install index.html -type f | sort | xargs cat \
            | grep -v '^# Converted:' | sha256sum | cut -d' ' -f1) > _site/fingerprint.txt

      - name: Skip if nothing changed
        id: check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          live=$(curl -fsSL "${SITE_URL}fingerprint.txt?t=$(date +%s)" 2>/dev/null || true)
          new=$(cat _site/fingerprint.txt)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$new" ]; then
            echo "No upstream changes; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        if: steps.check.outputs.changed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
